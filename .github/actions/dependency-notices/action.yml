name: Dependency notices
description: Generate and verify source license notices for a locked release target
inputs:
  target:
    description: Rust release target triple
    required: true
outputs:
  directory:
    description: Directory containing the verified DEPENDENCY-LICENSES.txt
    value: target/dependency-notices/${{ inputs.target }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
      with:
        tool: cargo-about@0.9.2
    - name: Generate dependency notices
      shell: bash
      env:
        NOTICE_TARGET: ${{ inputs.target }}
      run: python tools/licenses/generate.py --target "$NOTICE_TARGET"
