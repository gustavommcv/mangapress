name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Notice validation tests
        run: python -m unittest discover -s tools/licenses -p "test_*.py"
      - name: Release tag validation tests
        run: python -m unittest discover -s tools/release -p "test_*.py"
      - name: Installer regression tests
        run: python -m unittest discover -s tools/installers -p "test_*.py" -v

  dependency-notices:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup toolchain install --no-self-update
      - uses: ./.github/actions/dependency-notices
        with:
          target: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-notices-${{ matrix.target }}
          path: target/dependency-notices/${{ matrix.target }}/DEPENDENCY-LICENSES.txt
          if-no-files-found: error

  workflow-and-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check workflow syntax
        run: |
          "$(go env GOPATH)/bin/actionlint" -version
          "$(go env GOPATH)/bin/actionlint"
      - name: Check POSIX installer syntax
        run: shellcheck --shell=sh install.sh
      - name: Check dependency advisories
        run: cargo audit --deny warnings
