name: EPUB conformance

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/book_fixtures.py'
      - 'tools/book-fixtures-requirements.txt'
      - 'tools/epubcheck/**'
      - '.github/workflows/epubcheck.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/book_fixtures.py'
      - 'tools/book-fixtures-requirements.txt'
      - 'tools/epubcheck/**'
      - '.github/workflows/epubcheck.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/book-fixtures-requirements.txt
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install synthetic-fixture dependencies
        run: python -m pip install -r tools/book-fixtures-requirements.txt
      - name: Check gate failure handling
        run: python -m unittest discover -s tools/epubcheck -p 'test_*.py' -v
      - name: Validate fresh EPUB books and the broken-resource control
        run: python tools/epubcheck/check.py
      - name: Retain failed books and checker reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epub-conformance-failure
          path: |
            target/epubcheck/books/run-*/*.epub
            target/epubcheck/books/run-*/*.json
            target/epubcheck/books/run-*/*.log
            target/epubcheck/books/run-*/*/book.epub
            target/epubcheck/books/run-*/*/*.json
            target/epubcheck/books/run-*/*/*.log
          if-no-files-found: warn
          retention-days: 7
