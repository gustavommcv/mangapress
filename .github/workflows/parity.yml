name: KCC parity

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/parity/**'
      - 'tools/book_fixtures.py'
      - 'tools/epub_book.py'
      - 'tools/book-fixtures-requirements.txt'
      - '.github/workflows/parity.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/parity/**'
      - 'tools/book_fixtures.py'
      - 'tools/epub_book.py'
      - 'tools/book-fixtures-requirements.txt'
      - '.github/workflows/parity.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      extended:
        description: Include pre-release boundary, option interaction, and book checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      extended:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
      EXTENDED: ${{ inputs.extended || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/parity/requirements.txt
            tools/book-fixtures-requirements.txt
      - name: Install comparison dependencies
        run: python -m pip install -r tools/parity/requirements.txt
      - name: Check comparison bookkeeping
        run: python -m unittest discover -s tools/parity -p 'test_*.py' -v
      - name: Check out the reference KCC release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ciromattia/kcc
          ref: f127adbca992456e173d88ada18643eae66802fb # v12.0.0
          path: target/kcc-reference
          persist-credentials: false
      - name: Compare the full Kindle 11 matrix
        run: |
          args=()
          if [[ "$EXTENDED" == "true" ]]; then args+=(--extended); fi
          python tools/parity/parity.py --kcc target/kcc-reference --work target/parity/K11 "${args[@]}"
      - name: Compare actual EPUB and CBZ books
        run: |
          args=()
          if [[ "$EXTENDED" == "true" ]]; then args+=(--extended); fi
          python tools/parity/books.py --kcc target/kcc-reference "${args[@]}"
      - name: Compare representative device profiles
        run: |
          for profile in K1 K2 KDX KS3 KCS KoLC RmkPPMove; do
            python tools/parity/parity.py --kcc target/kcc-reference --profile "$profile" --smoke --work "target/parity/$profile"
          done
      - name: Compare Scribe webtoon processing
        run: python tools/parity/parity.py --kcc target/kcc-reference --profile KS3 --only webtoon --work target/parity/KS3-webtoon
