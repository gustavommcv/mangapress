name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate the release tag and merged commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/release/check_tag.py "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  parity:
    needs: validate-tag
    uses: ./.github/workflows/parity.yml

  build:
    needs: [checks, parity]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Both macOS targets build on macos-14 (Apple Silicon) -- its
          # Xcode toolchain cross-links x86_64 binaries fine, and the
          # macos-13 runner pool has been seen queuing indefinitely as
          # GitHub phases it out.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the repository toolchain and release target
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install --no-self-update
          rustup target add "$RELEASE_TARGET"
        shell: bash

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mangapress-cli

      - uses: ./.github/actions/dependency-notices
        id: notices
        with:
          target: ${{ matrix.target }}

      # The licenses and third-party notices travel with the binary: the
      # notices' own terms ask for that. Installers and Mangabound take the
      # executable by name, so the extra files are inert to them.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "mangapress-${{ matrix.target }}.tar.gz" \
            -C "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release" mangapress \
            -C "$GITHUB_WORKSPACE" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md \
            -C "$GITHUB_WORKSPACE/${{ steps.notices.outputs.directory }}" DEPENDENCY-LICENSES.txt

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/mangapress.exe, `
              LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.md, `
              ${{ steps.notices.outputs.directory }}/DEPENDENCY-LICENSES.txt `
            -DestinationPath mangapress-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangapress-${{ matrix.target }}
          path: mangapress-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: mangapress-*

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes
