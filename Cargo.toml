[workspace]
resolver = "2"
members = ["crates/mangapress-core", "crates/mangapress-cli"]

[workspace.package]
version = "0.7.3"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gustavommcv/mangapress"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
png = "0.18"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
rustfft = "6"
zip = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
printpdf = { version = "0.12", default-features = false, features = ["images"] }
roxmltree = "0.21"
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
