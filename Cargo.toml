[workspace]
resolver = "2"
members = ["crates/mangapress-core", "crates/mangapress-cli"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gustavommcv/mangapress"

[workspace.dependencies]
image = "0.25"
imageproc = "0.25"
rustfft = "6"
zip = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
slug = "0.1"
printpdf = { version = "0.12", default-features = false, features = ["images"] }
roxmltree = "0.21"
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
